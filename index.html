<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="assets/aegis-logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aegis AI</title>
<section class="card">

<h2>⚙️ Aegis Profile</h2>


<label>
Name
</label>

<input id="userName"
placeholder="Enter your name">


<label>
Bible Translation
</label>

<select id="bibleVersion">

<option value="NIV">
NIV
</option>

<option value="KJV">
KJV
</option>

<option value="ESV">
ESV
</option>

<option value="NKJV">
NKJV
</option>

</select>


<label>
Assistant Style
</label>

<select id="assistantStyle">

<option value="Professional">
Professional
</option>

<option value="Friendly">
Friendly
</option>

<option value="Technical">
Technical
</option>

</select>


<button onclick="saveProfile()">
Save Profile
</button>


<p id="profileStatus"></p>


</section>

<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

</head>


<body>

<div class="container">

<div class="logo-container">

    <img src="assets/aegis-logo.png" 
         class="aegis-logo">

    <h1>AEGIS</h1>

</div>

<div id="status">

Initializing Aegis...

</div>

<section class="card">

<h2>🤖 Morning Briefing</h2>

<div id="briefing">

Generating briefing...

</div>

</section>

<section class="card">

<h2>Daily Bible Verse</h2>

<p id="verse">
Loading verse...
</p>

</section>



<section class="card">

<h2>📅 Calendar</h2>

<div id="calendar"></div>


<hr>


<h2>➕ Create Event</h2>


<label>
Event Name
</label>

<input id="eventTitle"
placeholder="Event name">



<label>
Category
</label>

<select id="eventCategory">

</select>



<label>
Date
</label>

<input id="eventDate"
type="date">



<label>
Time
</label>

<input id="eventTime"
type="time">



<label>
Location
</label>

<input id="eventLocation"
placeholder="Where?">



<label>
Notes
</label>

<textarea id="eventNotes"
placeholder="Details"></textarea>



<label>

<input id="eventReminder"
type="checkbox">


Notify me before event

</label>



<button id="saveEventButton" onclick="addEvent()">

Save Event

</button>



<div id="eventList"></div>


</section>


<section class="card">

<h2>🏷️ Categories</h2>


<label>
New Category
</label>

<input id="categoryName"
placeholder="Example: School">


<label>
Color
</label>

<select id="categoryColor">

<option value="green">
Green
</option>

<option value="blue">
Blue
</option>

<option value="purple">
Purple
</option>

<option value="red">
Red
</option>

<option value="gray">
Gray
</option>

</select>


<button onclick="addCategory()">

Add Category

</button>


<div id="categoryList"></div>


</section>


<section class="card">

<h2>🔔 Reminders</h2>


<label>
Task
</label>

<input id="reminderInput"
placeholder="What needs to be done?">



<label>
Date
</label>

<input id="reminderDate"
type="date">



<label>
Time
</label>

<input id="reminderTime"
type="time">



<button onclick="addReminder()">
Save Reminder
</button>


<div id="reminderList"></div>


</section>


</div>



<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>


<script src="js/storage.js"></script>

<script src="js/core.js"></script>

<script src="js/categories.js"></script>

<script src="js/events.js"></script>

<script src="js/calendar.js"></script>

<script src="js/profile.js"></script>

<script src="js/reminders.js"></script>

<script src="js/bible.js"></script>

<script src="js/briefing.js"></script>

<script src="js/notifications.js"></script>

<script src="js/app.js"></script>


</body>

</html>
