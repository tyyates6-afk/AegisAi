<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" type="image/png" href="assets/aegis-logo.png">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00d9ff">

<title>AEGIS AI</title>


<link rel="stylesheet" href="style.css">


<link 
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" 
rel="stylesheet">


</head>



<body>


<div class="container">


<!-- =========================
        AEGIS HEADER
========================= -->

<header class="aegis-header">


    <div class="logo-container">


        <img 
        src="assets/aegis-logo.png"
        class="aegis-logo">


        <div>

            <h1>
            AEGIS
            </h1>

            <p>
            Personal AI Assistant
            </p>

        </div>


    </div>



    


</header>





<!-- =========================
        DASHBOARD
========================= -->


<section id="dashboard" class="panel">

<button onclick="Dashboard.toggleEditMode()">

⚙ Edit Dashboard

</button>

<h2 class="dashboard-title">

AEGIS Dashboard

</h2>




<div class="dashboard-grid">



<div class="dashboard-card hero-card" id="card-greeting">
    <div id="greeting"></div>

    <div id="currentDate"></div>

    <div id="currentTime"></div>

</div>

<div class="dashboard-card small-card" id="card-events">
    <div id="todayEvents"></div>
</div>

<div class="dashboard-card medium-card" id="card-verse">
    <div id="dailyVerse"></div>
</div>

<div class="dashboard-card small-card" id="card-reminders">
    <div id="todayReminders"></div>
</div>

<div class="dashboard-card full-card" id="card-actions">
    <div id="quickActions"></div>
</div>

<div class="dashboard-card small-card" id="card-weather">
    <div id="weather"></div>
</div>

<div class="dashboard-card medium-card" id="card-profile">
    <div id="profileWidget"></div>
</div>

<div class="dashboard-card small-card" id="card-notifications">
    <div id="notifications"></div>
</div>

<div class="dashboard-card full-card" id="card-status">
    <div id="aegisStatus"></div>
</div>


</div>


</section>







<!-- =========================
        PLANNER
========================= -->


<section class="card">


<h2>
📅 Planner
</h2>



<div id="calendar"></div>



<hr>




<h2>
➕ Create Event
</h2>



<label>
Event Name
</label>


<input 
id="eventTitle"
placeholder="Event name">





<label>
Category
</label>


<select id="eventCategory">

</select>





<label>
Date
</label>


<input 
id="eventDate"
type="date">





<label>
Time
</label>


<input 
id="eventTime"
type="time">





<label>
Location
</label>


<input
id="eventLocation"
placeholder="Where?">





<label>
Notes
</label>


<textarea
id="eventNotes"
placeholder="Details"></textarea>






<div id="eventNotifications">


<label>
Notifications:
</label>



<label>
<input type="checkbox" value="60">
1 hour before
</label>


<label>
<input type="checkbox" value="30">
30 minutes before
</label>


<label>
<input type="checkbox" value="15">
15 minutes before
</label>


<label>
<input type="checkbox" value="5">
5 minutes before
</label>


</div>





<button 
id="saveEventButton"
onclick="addEvent()">

Save Event

</button>





<div id="eventList"></div>



</section>








<section class="card">


<h2>
🔔 Reminders
</h2>



<label>
Task
</label>


<input
id="reminderInput"
placeholder="What needs to be done?">




<label>
Date
</label>


<input
id="reminderDate"
type="date">





<label>
Time
</label>


<input
id="reminderTime"
type="time">





<button onclick="addReminder()">

Save Reminder

</button>





<div id="reminderList"></div>



</section>









<!-- =========================
        SETTINGS
========================= -->


<section class="card">


<h2>
⚙️ AEGIS Profile
</h2>



<label>
Name
</label>


<input 
id="userName"
placeholder="Enter your name">





<label>
Bible Translation
</label>


<select id="bibleVersion">

<option value="NIV">
NIV
</option>


<option value="KJV">
KJV
</option>


<option value="ESV">
ESV
</option>


<option value="NKJV">
NKJV
</option>


</select>






<label>
Assistant Style
</label>


<select id="assistantStyle">


<option value="Professional">
Professional
</option>


<option value="Friendly">
Friendly
</option>


<option value="Technical">
Technical
</option>


</select>





<label>
City
</label>


<input id="userCity">



<label>
State
</label>


<input id="userState">



<label>
Country
</label>


<input id="userCountry">





<label>
Temperature
</label>


<select id="temperatureUnit">


<option value="F">
Fahrenheit
</option>


<option value="C">
Celsius
</option>


</select>





<button onclick="saveProfile()">

Save Profile

</button>



<p id="profileStatus"></p>


</section>









<section class="card">


<h2>
🏷️ Categories
</h2>



<label>
New Category
</label>



<input
id="categoryName"
placeholder="Example: School">





<label>
Color
</label>


<select id="categoryColor">


<option value="green">
Green
</option>


<option value="blue">
Blue
</option>


<option value="purple">
Purple
</option>


<option value="red">
Red
</option>


<option value="gray">
Gray
</option>


</select>





<button onclick="addCategory()">

Add Category

</button>




<div id="categoryList"></div>



</section>





</div>






<!-- =========================
        LIBRARIES
========================= -->


<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>





<!-- =========================
        AEGIS CORE
========================= -->


<script src="JS/storage.js"></script>

<script src="JS/core.js"></script>





<!-- =========================
        MODULES
========================= -->


<script src="JS/categories.js"></script>

<script src="JS/events.js"></script>

<script src="JS/reminders.js"></script>

<script src="JS/calendar.js"></script>

<script src="JS/bible.js"></script>

<script src="JS/notifications.js"></script>

<script src="JS/weather.js"></script>

<script src="JS/profile.js"></script>

<script src="JS/utils/formatters.js"></script>





<!-- =========================
        DASHBOARD
========================= -->

<script src="Js/DragManager.js"></script>
<script src="JS/dashboardManager.js"></script>




<script src="JS/widgets/greetingwidget.js"></script>

<script src="JS/widgets/todayEventsWidget.js"></script>

<script src="JS/widgets/todaysRemindersWidget.js"></script>

<script src="JS/widgets/bibleWidget.js"></script>

<script src="JS/widgets/notificationsWidget.js"></script>

<script src="JS/widgets/quickActionsWidget.js"></script>

<script src="JS/widgets/profileWidget.js"></script>

<script src="JS/widgets/statusWidget.js"></script>

<script src="JS/widgets/weatherWidget.js"></script>





<script src="JS/dashboard.js"></script>

<script src="JS/app.js"></script>



</body>

</html>
