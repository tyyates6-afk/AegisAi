<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>AEGIS</h1>
    <p class="status">Systems Online</p>

    <div class="card">
        <h2>Daily Bible Verse</h2>
        <p id="verse">
            "Be strong and courageous. Do not be afraid... for the Lord your God goes with you."
            — Deuteronomy 31:6
        </p>
    </div>

    <div class="card">
        <h2>Reminder</h2>

        <input id="reminderInput"
               placeholder="Enter reminder">

        <button onclick="addReminder()">
            Save Reminder
        </button>

        <ul id="reminderList"></ul>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
